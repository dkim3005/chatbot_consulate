list:
  container: "div.board_list"
  rows: "div.board_list tbody tr"
  total_text: "div.bo_info"
  view_function: "f_view('<seq>')"

detail:
  container: "div.board_detail"
  title: "div.board_detail div.bo_head h2"
  metadata_pairs: "div.board_detail div.bo_head dl dt + dd"
  attachments: "div.board_detail div.bo_file"
  content: "div.board_detail div.bo_con"

notes:
  - "현재 scripts/crawl_consulate.py는 외부 의존성을 줄이기 위해 CSS selector 엔진 없이 class 기반 HTML 파서를 사용한다."
  - "raw HTML fixture와 BeautifulSoup/lxml 도입 후 이 파일을 실제 selector 설정으로 연결할 수 있다."
